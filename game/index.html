<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Courier — a stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Night Courier: sneak through the moonlit museum, avoid the guards' vision cones, and reach the golden exit door unseen"></canvas>
<noscript><p style="color:#e8ecf4;font-family:sans-serif;text-align:center">The Night Courier needs JavaScript to play.</p></noscript>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
